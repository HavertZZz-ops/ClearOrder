<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanOrder - Reportar Problema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-700 antialiased min-h-screen flex">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-sparkles text-lg"></i>
                </div>
                <span class="text-xl font-bold text-blue-900">CleanOrder</span>
            </div>

            <div class="px-4 mt-2">
                <div class="px-4 py-3 bg-blue-50/70 rounded-xl">
                    <span class="text-[10px] font-bold tracking-wider text-blue-600 uppercase block mb-0.5">Perfil</span>
                    <span class="text-sm font-semibold text-slate-800">Estudante</span>
                </div>
            </div>
            
            <nav class="px-4 mt-6 space-y-2">
                <a href="{% url 'painel_estudante' %}" class="flex items-center space-x-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl transition">
                    <i class="fa-solid fa-house"></i>
                    <span class="font-medium">Inicio</span>
                </a>
                <a href="#" class="flex items-center space-x-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-xl transition">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span class="font-bold">Reportar Problema</span>
                </a>
            </nav>
        </div>
        
        <div class="p-4">
            <a href="{% url 'logout' %}" class="flex items-center space-x-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-rose-600 rounded-xl transition">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="font-semibold">Logout</span>
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <h1 class="text-base font-bold text-slate-800">Infraestrutura</h1>
            
            <div class="flex items-center space-x-4">
                <button class="relative text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-regular fa-bell text-lg"></i>
                </button>
                <div class="w-9 h-9 bg-blue-700 text-white rounded-full flex items-center justify-center font-bold text-xs">
                    AL
                </div>
            </div>
        </header>

        <main class="flex-1 p-8 overflow-y-auto flex justify-center items-start">
            
            <div class="w-full max-w-2xl bg-white p-8 rounded-2xl border border-slate-200 shadow-sm mt-4">
                
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-900">Reportar Problema</h2>
                    <p class="text-sm text-slate-500 mt-1">Descreva o problema de infraestrutura encontrado no seu quarto ou bloco.</p>
                </div>

                <form class="space-y-6">
                    
                    <div class="space-y-2">
                        <label for="titulo" class="text-sm font-bold text-slate-800">Título do Problema</label>
                        <input type="text" id="titulo" name="titulo" placeholder="Ex: Lâmpada queimada, Chuveiro frio..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
                    </div>

                    <div class="space-y-2">
                        <label for="categoria" class="text-sm font-bold text-slate-800">Categoria</label>
                        <select id="categoria" name="categoria" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition appearance-none" required>
                            <option value="" disabled selected>Selecione o tipo de problema...</option>
                            <option value="eletrica">Elétrica (Lâmpadas, tomadas, chuveiro)</option>
                            <option value="hidraulica">Hidráulica (Vazamentos, torneiras, vaso)</option>
                            <option value="mobiliario">Mobiliário (Camas, armários, portas)</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label for="descricao" class="text-sm font-bold text-slate-800">Descrição Detalhada</label>
                        <textarea id="descricao" name="descricao" rows="5" placeholder="Explique exatamente onde está o problema e o que aconteceu..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none" required></textarea>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
                        <a href="{% url 'painel_estudante' %}" class="py-3 px-6 bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 font-semibold text-sm rounded-xl transition">
                            Cancelar
                        </a>
                        <button type="submit" class="py-3 px-6 bg-blue-600 text-white hover:bg-blue-700 font-semibold text-sm rounded-xl transition flex items-center space-x-2 shadow-sm">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>Enviar Relatório</span>
                        </button>
                    </div>

                </form>

            </div>

        </main>
    </div>
</body>
</html>
